name: Build feed

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - source_updated
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: build-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build feed
        run: npm run build

      - name: Notify Telegram about new items
        id: telegram
        continue-on-error: true
        run: npm run notify:telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

      - name: Commit generated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update feed"
          file_pattern: data/feed.json data/telegram-state.json atom.xml

      - name: Check Telegram delivery
        if: steps.telegram.outcome == 'failure'
        run: exit 1
