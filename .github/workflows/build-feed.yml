name: Build feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build feed
        run: npm run build

      - name: Commit generated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update feed"
          file_pattern: data/feed.json atom.xml
