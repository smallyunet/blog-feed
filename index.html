<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="smallyu 的聚合动态，包含博客、B 面、疯狂版、旧博客和微博。">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
    <title>smallyu feed</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="alternate" type="application/atom+xml" title="smallyu feed" href="./atom.xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://smallyu.net/">smallyu的博客</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle Navigation Menu" aria-expanded="false">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <nav class="nav-collapse" id="nav-menu">
        <ul class="nav-list">
          <li><a href="https://smallyu.net">博客</a></li>
          <li><a href="https://b.smallyu.net/">B 面</a></li>
          <li><a href="https://crazy.smallyu.net/">疯狂版</a></li>
          <li><a href="https://old-blog.smallyu.net/">旧博客</a></li>
          <li><a href="https://t.smallyu.net/">微博</a></li>
          <li class="active"><a href="./">聚合</a></li>
          <li><a href="./atom.xml">订阅</a></li>
          <li><a href="https://smallyu.net/about">联系</a></li>
        </ul>
      </nav>
    </header>

    <main class="outer">
      <section class="feed-toolbar" aria-label="Feed filters">
        <div class="filter-tabs" id="filter-tabs" role="tablist" aria-label="Sources">
          <button class="filter-tab" type="button" data-filter="all" aria-selected="true">全部</button>
          <button class="filter-tab" type="button" data-filter="blog" aria-selected="false">博客</button>
          <button class="filter-tab" type="button" data-filter="blog-b" aria-selected="false">B 面</button>
          <button class="filter-tab" type="button" data-filter="blog-crazy" aria-selected="false">疯狂版</button>
          <button class="filter-tab" type="button" data-filter="old-blog" aria-selected="false">旧博客</button>
          <button class="filter-tab" type="button" data-filter="micro" aria-selected="false">微博</button>
        </div>
        <div class="feed-meta" id="feed-meta">Loading...</div>
      </section>

      <ol class="list-group" id="feed-list" aria-live="polite"></ol>
      <div class="load-more-wrap">
        <button class="load-more" id="load-more" type="button" hidden>加载更多</button>
      </div>
    </main>

    <template id="loading-template">
      <li class="list-group-item loading-row">
        <span></span>
        <span></span>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
