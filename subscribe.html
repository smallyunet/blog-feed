<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="通过 Atom XML 或 Telegram 订阅 smallyu feed。">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
    <title>订阅 · smallyu feed</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="alternate" type="application/atom+xml" title="smallyu feed" href="./atom.xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://smallyu.net/">smallyu的博客</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle Navigation Menu" aria-expanded="false">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <nav class="nav-collapse" id="nav-menu">
        <ul class="nav-list">
          <li><a href="https://smallyu.net">博客</a></li>
          <li><a href="https://b.smallyu.net/">B 面</a></li>
          <li><a href="https://crazy.smallyu.net/">疯狂版</a></li>
          <li><a href="https://old-blog.smallyu.net/">旧博客</a></li>
          <li><a href="https://t.smallyu.net/">微博</a></li>
          <li><a href="./">聚合</a></li>
          <li class="active"><a href="./subscribe.html" aria-current="page">订阅</a></li>
          <li><a href="https://smallyu.net/about">联系</a></li>
        </ul>
      </nav>
    </header>

    <main class="outer subscribe-outer">
      <header class="subscribe-heading">
        <p class="subscribe-eyebrow">smallyu feed</p>
        <h1>订阅</h1>
        <p>选择你习惯的方式，获取聚合动态的最新内容。</p>
      </header>

      <div class="subscribe-list">
        <a class="subscribe-card" href="./atom.xml" type="application/atom+xml">
          <span class="subscribe-card-label">Atom XML</span>
          <span class="subscribe-card-description">添加到 RSS 或 Atom 阅读器</span>
          <span class="subscribe-card-address">feed.smallyu.net/atom.xml</span>
        </a>

        <a class="subscribe-card" href="https://t.me/smallyu_feed">
          <span class="subscribe-card-label">Telegram</span>
          <span class="subscribe-card-description">在 Telegram 频道接收更新</span>
          <span class="subscribe-card-address">@smallyu_feed</span>
        </a>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
